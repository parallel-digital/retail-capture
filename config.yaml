# Where runs are saved. Point this at a synced OneDrive/SharePoint folder if you like.
output_dir: output

# Set true to save each page's HTML next to its screenshot (use to find the right selectors).
debug_html: false

browser:
  # cdp        = launch the real Edge/Chrome and drive it. Looks like a normal shopper, so Amazon serves ads.
  # playwright = browser launched by automation (Amazon often withholds sponsored placements from it).
  mode: cdp
  channel: msedge          # Edge ships with Windows; "chrome" also works if installed
  profile_dir: edge_profile   # persistent profile: keeps ZIP code and cookies (run the one-time setup after changing)
  headless: false          # false = a browser window appears during capture (recommended for ads)
  debug_port: 9222
  viewport: {width: 1440, height: 900}
  locale: en-US

timing:
  settle_ms: 2500          # wait after load
  scroll_pause_ms: 450     # pause between scroll steps (triggers lazy loading)
  between_urls_sec: [20, 45] # random pause between URLs. Slower = far fewer Amazon human checks
  retries: 1

# What to do when Amazon shows an "I am human" check
blocks:
  wait_for_human_sec: 180   # visible browser: wait this long for you to tick the box, then continue
  cooldown_sec: 120         # pause after a block before the next URL
  retry_blocked: true       # retry blocked URLs once at the end of the run

# Click these if present (cookie banners, location popups)
dismiss_selectors:
  - "#sp-cc-accept"
  - "input[data-action-type='DISMISS']"
  - "button:has-text('Accept')"
  - "button[aria-label='Close']"

# Auto-clips per page_type. Selectors WILL need tuning to your pages; use browser DevTools.
# max = how many matching elements to clip (e.g. first 4 bestseller tiles).
clips:
  bestsellers:
    - {name: top-items, selector: "#gridItemRoot", max: 5}
  search:
    - {name: top-results, selector: "[data-component-type='s-search-result']", max: 4}
    # Sponsored product cards (any result card containing "Sponsored")
    - {name: sponsored-products, selector: "[data-component-type='s-search-result']", has_text: "Sponsored", max: 6}
    # Sponsored Brands: banner with product carousel (e.g. "Class D car audio amplifiers | Shop Brand")
    - {name: sponsored-brand-banner, selector: ".s-widget-container:has(a[aria-label^='Sponsored ad from'])", max: 2}
    # Sponsored Brands video (single and multi product)
    - {name: sponsored-video, selector: ".s-widget-container:has([data-component-type^='sbv-video'])", max: 3}
    # Sponsored carousels inside results ("Customers frequently viewed", "Seen on social media" ...)
    - {name: sponsored-carousel, selector: ".s-widget-container:has([data-component-type='s-searchgrid-carousel'])", has_text: "Sponsored", max: 3}
    # "Brands related to your search" footer
    - {name: sponsored-brand-footer, selector: ".AdHolder:has([cel_widget_id*='brand-footer'])", max: 1}
    # Display ads: left skyscrapers and bottom banner
    - {name: sponsored-display, selector: ".AdHolder:has([cel_widget_id^='loom-desktop-skyscraper']), .AdHolder:has([cel_widget_id^='loom-desktop-footer-slot'])", max: 4}
  deals:
    - {name: deal-tiles, selector: "[data-testid='deal-card'], [data-testid='DealCard']", max: 6}
  brand_store:
    - {name: hero, selector: "[class*='hero'], [id*='hero']", max: 1}
