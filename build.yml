name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pyinstaller
      - name: Validate capture build
        shell: bash
        run: |
          grep -q 'Event setup' app.py
          grep -q 'Save page HTML' app.py
          grep -q 'from page_data import' capture.py
          test -f manifest.py
          test -f page_data.py
          python -m unittest test_page_data.py
      - name: Package with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --name RetailCapture \
            --collect-all streamlit --collect-all playwright --collect-all streamlit_cropper \
            --copy-metadata streamlit \
            --hidden-import PIL --hidden-import pandas --hidden-import yaml --hidden-import openpyxl \
            --hidden-import common --hidden-import capture --hidden-import manifest --hidden-import page_data \
            --add-data "app.py;." --add-data "config.yaml;." --add-data "urls.csv;." \
            launcher.py
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: RetailCapture-Setup
          path: installer/RetailCapture-Setup.exe
