name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pyinstaller
      - name: Validate source and tests
        shell: bash
        run: |
          python -m py_compile capture.py page_data.py manifest.py common.py runtime_control.py
          python -m unittest test_page_data.py test_runtime_control.py
          grep -q "deterministic composite" capture.py
          grep -q "a-truncate-full.a-offscreen" page_data.py
      - name: Package with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --name RetailCapture \
            --collect-all streamlit --collect-all playwright --collect-all streamlit_cropper \
            --copy-metadata streamlit \
            --hidden-import PIL --hidden-import pandas --hidden-import yaml --hidden-import openpyxl \
            --hidden-import capture --hidden-import page_data --hidden-import manifest \
            --hidden-import common --hidden-import runtime_control \
            --add-data "app.py;." --add-data "capture.py;." --add-data "page_data.py;." \
            --add-data "manifest.py;." --add-data "common.py;." --add-data "runtime_control.py;." \
            --add-data "config.yaml;." --add-data "urls.csv;." \
            launcher.py
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: RetailCapture-Setup
          path: installer/RetailCapture-Setup.exe
